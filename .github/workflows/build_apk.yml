name: Build APK SIAGA-HADIR BNPB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android Platform
        run: |
          # Simpan google-services.json resmi
          cp android/app/google-services.json /tmp/google-services.json 2>/dev/null || true
          
          # Bentuk ulang struktur Android platform resmi
          rm -rf android/
          flutter create . --platforms=android --org com.bnpb
          
          # Hapus file contoh bawaan
          rm -f test/widget_test.dart
          
          # Kembalikan google-services.json
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json
          
          # Konfigurasi plugin Google Services, minSdk 21, dan multiDex
          python3 scripts/configure_android.py

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test test/haversine_test.dart test/attendance_model_test.dart

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: siaga-hadir-bnpb-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
