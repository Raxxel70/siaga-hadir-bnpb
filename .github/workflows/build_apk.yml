name: Build APK SIAGA-HADIR BNPB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android platform files
        run: |
          cp android/app/google-services.json /tmp/google-services.json || true
          flutter create . --platforms=android --org com.bnpb
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json || true

      - name: Add Google Services Plugin to Gradle
        run: |
          # Tambahkan classpath google-services di android/build.gradle jika belum ada
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle || true
          fi
          # Tambahkan plugin google-services di android/app/build.gradle jika belum ada
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo 'apply plugin: "com.google.gms.google-services"' >> android/app/build.gradle || true
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: siaga-hadir-bnpb-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
